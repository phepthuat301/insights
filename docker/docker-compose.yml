version: "3.7"
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: insights_postgres
      POSTGRES_USER: insights_user
      POSTGRES_PASSWORD: insights123
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights_user -d insights_postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    ports:
      - 8000:8000
      - 9000:9000

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
      - postgresql
    environment:
      ADMINER_DEFAULT_SERVER: mariadb

volumes:
  mariadb-data:
  postgresql-data: